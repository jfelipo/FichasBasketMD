<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de baloncesto a XML</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f2f5;
            margin: 0;
            padding: 2rem 1rem;
            box-sizing: border-box;
        }
        .main-container {
            background: white;
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 1000px;
        }
        header {
            text-align: center;
            margin-bottom: 2rem;
        }
        h1 { font-size: 1.8rem; text-align: center; margin: 0 0 0.5rem 0; color: #142033; }
        .subtitle { text-align: center; color: #6c757d; margin-bottom: 2rem; font-size: 0.95rem; }

        /* Pestañas principales (Euroliga / ACB) */
        .league-selector {
            display: flex;
            gap: 0.5rem;
            padding: 0.35rem;
            margin-bottom: 2rem;
            background: #f1f3f8;
            border-radius: 12px;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }
        .league-option {
            flex: 1;
            padding: 0.7rem 0.5rem;
            background: transparent;
            color: #525866;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .league-option.active {
            background: #6a6cff;
            color: #fff;
            box-shadow: 0 2px 6px rgba(35, 39, 80, 0.16);
        }

        /* Grid de 2 columnas (Izquierda: Input, Derecha: Preview) */
        .converter-grid {
            display: grid;
            grid-template-columns: 1fr 1.1fr;
            gap: 1.5rem;
        }

        /* Panel Izquierdo */
        .left-panel {
            display: flex;
            flex-direction: column;
        }
        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid #e2e8f0;
        }
        .panel-title { font-size: 1.1rem; font-weight: 700; color: #202b3a; }
        .badge {
            background: #eef2ff;
            color: #6a6cff;
            padding: 0.3rem 0.6rem;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            border: 1px solid #c7d2fe;
        }

        /* Pestañas internas (Ficha / Jornada / Clasificación) */
        .type-selector {
            display: flex;
            gap: 0.25rem;
            background: #f1f3f8;
            padding: 6px;
            border-radius: 10px;
            margin-bottom: 1.5rem;
        }
        .type-tab {
            flex: 1;
            padding: 0.6rem;
            background: transparent;
            border: none;
            border-radius: 8px;
            color: #536174;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .type-tab.active {
            background: #ed570b;
            color: #fff;
            box-shadow: 0 2px 5px rgba(197, 69, 10, 0.18);
        }

        .form-group { margin-bottom: 1rem; display: flex; flex-direction: column; flex-grow: 1; }
        .form-label { display: block; margin-bottom: 0.5rem; color: #303b4b; font-weight: 500; font-size: 0.9rem; }
        .form-input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #dbe2ea;
            border-radius: 8px;
            box-sizing: border-box;
            background: #fbfcfe;
            color: #243044;
            font-size: 0.95rem;
            font-family: inherit;
            outline: none;
        }
        .form-input:focus { border-color: #6a6cff; background: #fff; }
        textarea.form-input { resize: vertical; min-height: 120px; }

        .radio-group { display: flex; gap: 1rem; margin-top: 0.5rem; }
        .radio-group label { display: flex; align-items: center; gap: 0.4rem; font-size: 0.9rem; color: #3f4b5b; font-weight: 500; }

        /* Botones */
        .btn-group { display: flex; gap: 0.65rem; margin-top: auto; padding-top: 1rem; }
        button {
            border: none;
            border-radius: 8px;
            padding: 0.75rem 1rem;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }
        button:disabled { opacity: 0.6; cursor: wait; }
        .btn-preview { background-color: #6a6cff; color: white; flex: 2; }
        .btn-preview:hover:not(:disabled) { background-color: #5a5cff; }
        .btn-copy { background-color: #344054; color: white; flex: 1; }
        .btn-copy:hover:not(:disabled) { background-color: #263244; }
        .btn-download { background-color: #28a745; color: white; flex: 1; }
        .btn-download:hover:not(:disabled) { background-color: #218838; }

        /* Panel Derecho (Vista Previa) */
        #xml-viewer {
            flex-grow: 1;
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 1rem;
            overflow-y: auto;
            max-height: 450px;
            white-space: pre-wrap;
            word-break: break-all;
            color: #212529;
            font-family: "SFMono-Regular", Consolas, monospace;
            font-size: 0.85rem;
            margin: 0;
        }
        .placeholder-text {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #94a3b8;
            font-style: italic;
            background: #f8f9fa;
            border: 1px dashed #cbd5e1;
            border-radius: 8px;
            padding: 2rem;
        }

        .message-box {
            margin-top: 1rem;
            padding: 0.8rem;
            border-radius: 8px;
            font-size: 0.9rem;
            display: none;
        }
        .message-box.success { background: #d4edda; color: #155724; display: block; }
        .message-box.error { background: #f8d7da; color: #721c24; display: block; }

        @media (max-width: 768px) {
            .converter-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="main-container">
    <header>
        <h1>Conversor de baloncesto a XML</h1>
        <p class="subtitle">Genera fichas XML de partidos, jornadas y clasificaciones de Euroliga y Liga Endesa</p>
    </header>

    <div class="league-selector" role="group" aria-label="Selecciona la competición">
        <button type="button" class="league-option active" data-league="euroleague">Euroliga</button>
        <button type="button" class="league-option" data-league="acb">Liga Endesa (ACB)</button>
    </div>

    <div class="converter-grid">
        <!-- Columna Izquierda: Inputs -->
        <div class="left-panel">
            <div class="panel-header">
                <span class="panel-title" id="panel-title">Ficha de partido</span>
                <span class="badge" id="league-badge">Euroliga</span>
            </div>

            <div class="type-selector">
                <button type="button" class="type-tab active" data-type="match">Ficha</button>
                <button type="button" class="type-tab" data-type="gameday">Jornada</button>
                <button type="button" class="type-tab" data-type="standings">Clasificación</button>
            </div>

            <!-- Formularios -->
            <div id="form-match" class="form-group" style="display: flex;">
                <div id="match-euroleague" style="width: 100%;">
                    <label class="form-label">URL del partido de Euroliga</label>
                    <input type="url" id="euroleague-url" class="form-input" value="https://live.euroleague.net/api/boxscore?gamecode=11&seasoncode=E2025">
                </div>
                <div id="match-acb" style="width: 100%; display: none;">
                    <label class="form-label">Número de partido de ACB</label>
                    <input type="text" id="acb-match-id" class="form-input" inputmode="numeric" pattern="[0-9]*" placeholder="Ej.: 104669">
                </div>
            </div>

            <div id="form-gameday" class="form-group" style="display: none;">
                <label class="form-label">Número de Jornada</label>
                <input type="number" id="gameday-input" class="form-input" min="1" max="38" value="1">
                <div style="margin-top: 1rem;">
                    <label class="form-label">Formato XML</label>
                    <div class="radio-group">
                        <label><input type="radio" name="format-radio" value="ELBR" checked> ELBR (Resultados)</label>
                        <label><input type="radio" name="format-radio" value="ELBP"> ELBP (Próx. Jornada)</label>
                    </div>
                </div>
            </div>

            <div id="form-standings" class="form-group" style="display: none;">
                <label class="form-label">Datos de clasificación (Opcional)</label>
                <textarea id="standings-input" class="form-input" placeholder="Deja vacío para obtener automáticamente..."></textarea>
            </div>

            <div class="btn-group">
                <button type="button" id="btn-preview" class="btn-preview">Convertir a XML →</button>
                <button type="button" id="btn-copy" class="btn-copy">Copiar</button>
                <button type="button" id="btn-download" class="btn-download">Descargar</button>
            </div>
            
            <div id="status-msg" class="message-box"></div>
        </div>

        <!-- Columna Derecha: Vista Previa -->
        <div class="left-panel">
            <div class="panel-header">
                <span class="panel-title">Vista previa</span>
            </div>
            <div id="placeholder" class="placeholder-text">
                Selecciona una opción, introduce los datos y pulsa "Convertir a XML" para ver el resultado aquí.
            </div>
            <pre id="xml-viewer" style="display: none;"><code id="xml-content"></code></pre>
        </div>
    </div>
</div>

<script>
    let currentLeague = 'euroleague';
    let currentType = 'match';
    let currentFilename = 'ficha.xml';

    const btnPreview = document.getElementById('btn-preview');
    const btnCopy = document.getElementById('btn-copy');
    const btnDownload = document.getElementById('btn-download');
    const statusMsg = document.getElementById('status-msg');
    const xmlViewer = document.getElementById('xml-viewer');
    const xmlContent = document.getElementById('xml-content');
    const placeholder = document.getElementById('placeholder');

    function showStatus(msg, type) {
        statusMsg.textContent = msg;
        statusMsg.className = `message-box ${type}`;
    }

    function showXml(xml) {
        xmlContent.textContent = xml;
        placeholder.style.display = 'none';
        xmlViewer.style.display = 'block';
    }

    function updateUI() {
        // Actualizar badges y títulos
        document.getElementById('league-badge').textContent = currentLeague === 'euroleague' ? 'Euroliga' : 'Liga Endesa';
        document.getElementById('panel-title').textContent = currentType === 'match' ? 'Ficha de partido' : (currentType === 'gameday' ? 'Jornada' : 'Clasificación');

        // Mostrar/ocultar formularios según el tipo
        document.getElementById('form-match').style.display = currentType === 'match' ? 'flex' : 'none';
        document.getElementById('form-gameday').style.display = currentType === 'gameday' ? 'flex' : 'none';
        document.getElementById('form-standings').style.display = currentType === 'standings' ? 'flex' : 'none';

        // Si es ficha de partido, mostrar el input correcto según la liga
        if (currentType === 'match') {
            document.getElementById('match-euroleague').style.display = currentLeague === 'euroleague' ? 'block' : 'none';
            document.getElementById('match-acb').style.display = currentLeague === 'acb' ? 'block' : 'none';
        }

        // Ajustar el máximo de la jornada según la liga
        document.getElementById('gameday-input').max = currentLeague === 'euroleague' ? 38 : 34;

        // Limpiar vista previa
        placeholder.style.display = 'flex';
        xmlViewer.style.display = 'none';
        statusMsg.style.display = 'none';
    }

    document.querySelectorAll('.league-option').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.league-option').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentLeague = btn.dataset.league;
            updateUI();
        });
    });

    document.querySelectorAll('.type-tab').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.type-tab').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentType = btn.dataset.type;
            updateUI();
        });
    });

    async function copyText(text) {
        try { await navigator.clipboard.writeText(text); return true; } 
        catch (e) {
            const ta = document.createElement('textarea');
            ta.value = text; document.body.appendChild(ta); ta.select();
            const ok = document.execCommand('copy'); ta.remove(); return ok;
        }
    }

    function getPayload() {
        if (currentType === 'match') {
            if (currentLeague === 'euroleague') {
                return { endpoint: '/generate_xml_content', body: { league: 'euroleague', url: document.getElementById('euroleague-url').value.trim() }, filename: 'estadisticas_euroliga.xml' };
            } else {
                return { endpoint: '/generate_xml_content', body: { league: 'acb', matchId: document.getElementById('acb-match-id').value.trim() }, filename: 'estadisticas_acb.xml' };
            }
        } else if (currentType === 'gameday') {
            const gameday = Number(document.getElementById('gameday-input').value);
            const format = document.querySelector('input[name="format-radio"]:checked').value;
            const endpoint = currentLeague === 'euroleague' ? '/convert_euroleague_gameday' : '/convert_acb_gameday';
            return { endpoint, body: { gameday, format }, filename: `${format}.xml` };
        } else {
            const text = document.getElementById('standings-input').value;
            const endpoint = currentLeague === 'euroleague' ? '/convert_euroleague_standings' : '/convert_acb_standings';
            const filename = currentLeague === 'euroleague' ? 'ELBC.xml' : 'ACB-0001.xml';
            return { endpoint, body: { text }, filename };
        }
    }

    async function handleAction(action) {
        const { endpoint, body, filename } = getPayload();
        currentFilename = filename;

        // Validaciones básicas
        if (currentType === 'match') {
            if (currentLeague === 'euroleague' && !body.url) return showStatus('Introduce la URL.', 'error');
            if (currentLeague === 'acb' && !body.matchId) return showStatus('Introduce el ID del partido.', 'error');
        }

        btnPreview.disabled = true; btnCopy.disabled = true; btnDownload.disabled = true;
        showStatus('Procesando...', 'success');

        try {
            const response = await fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });

            if (action === 'download' && currentType === 'match') {
                // Para fichas de partido, usamos el endpoint de descarga directa de blobs
                const dlRes = await fetch('/download', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
                if (!dlRes.ok) {
                    const err = await dlRes.json().catch(() => ({}));
                    throw new Error(err.error || 'Error al descargar');
                }
                const blob = await dlRes.blob();
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url; a.download = currentFilename;
                document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
                showStatus('Descarga iniciada.', 'success');
            } else {
                // Para todo lo demás, pedimos JSON y lo mostramos
                const data = await response.json().catch(() => ({}));
                if (!response.ok) throw new Error(data.error || 'Error del servidor');
                
                showXml(data.xml_content);

                if (action === 'copy') {
                    const copied = await copyText(data.xml_content);
                    showStatus(copied ? 'XML copiado al portapapeles.' : 'Error al copiar.', copied ? 'success' : 'error');
                } else if (action === 'download') {
                    const blob = new Blob([data.xml_content], {type: 'application/xml;charset=utf-8'});
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url; a.download = currentFilename;
                    document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
                    showStatus('Descarga iniciada.', 'success');
                } else {
                    showStatus('Vista previa generada.', 'success');
                }
            }
        } catch (error) {
            showStatus(`Error: ${error.message}`, 'error');
        } finally {
            btnPreview.disabled = false; btnCopy.disabled = false; btnDownload.disabled = false;
        }
    }

    btnPreview.addEventListener('click', () => handleAction('preview'));
    btnCopy.addEventListener('click', () => handleAction('copy'));
    btnDownload.addEventListener('click', () => handleAction('download'));

    updateUI();
</script>

</body>
</html>
