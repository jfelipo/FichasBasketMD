<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de estadísticas de baloncesto</title>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f2f5;
            margin: 0;
            padding: 2rem 1rem;
            box-sizing: border-box;
        }
        .container {
            background: white;
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 600px;
        }
        h1 { font-size: 1.5rem; text-align: center; margin: 0 0 0.5rem 0; }
        .subtitle { text-align: center; color: #6c757d; margin-bottom: 2rem; }
        label { display: block; font-weight: 500; margin-bottom: 0.5rem; }
        input[type="url"], input[type="text"] { width: 100%; padding: 0.75rem; border: 1px solid #ced4da; border-radius: 8px; box-sizing: border-box; }
        .example { font-size: 0.8rem; color: #6c757d; background-color: #f8f9fa; padding: 0.5rem; border-radius: 4px; margin-top: 0.5rem; }
        .league-selector { display: flex; gap: 0.5rem; padding: 0.35rem; margin-bottom: 1.5rem; background: #f1f3f8; border-radius: 10px; }
        .league-option { flex: 1; padding: 0.7rem 0.5rem; background: transparent; color: #525866; }
        .league-option.active { background: #6a6cff; color: #fff; box-shadow: 0 2px 6px rgba(35, 39, 80, 0.16); }
        .buttons { display: flex; gap: 1rem; margin-top: 1.5rem; }
        button { flex-grow: 1; padding: 0.8rem 1rem; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background-color 0.2s ease; }
        button:disabled { opacity: 0.65; cursor: wait; }
        .btn-preview { background-color: #6a6cff; color: white; }
        .btn-download { background-color: #28a745; color: white; }
        .message { margin-top: 1.5rem; padding: 1rem; border-radius: 8px; display: none; }
        .message.success { background-color: #d4edda; color: #155724; }
        .message.error { background-color: #f8d7da; color: #721c24; }
        #xml-viewer {
            width: 100%;
            max-width: 600px;
            margin-top: 2rem;
            border-radius: 10px;
            overflow: hidden;
            display: none;
            background-color: #f8f9fa; /* Fondo claro para texto plano */
            border: 1px solid #dee2e6;
        }
        #xml-viewer pre {
            margin: 0;
            max-height: 500px;
            overflow-y: auto;
            padding: 1rem;
            color: #212529; /* Color de texto oscuro */
            white-space: pre-wrap;
            word-break: break-all;
        }
        @media (max-width: 560px) {
            body { padding: 1rem 0.75rem; }
            .container { padding: 1.5rem 1.1rem; }
            .buttons { flex-direction: column; gap: 0.65rem; }
            .league-option { font-size: 0.9rem; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1><span role="img" aria-label="baloncesto">⛹️</span> Conversor de estadísticas</h1>
    <p class="subtitle">Genera fichas XML de partidos de Euroliga y Liga Endesa</p>

    <form id="scraper-form">
        <div class="league-selector" role="group" aria-label="Selecciona la competición">
            <button type="button" class="league-option active" data-league="euroleague" aria-pressed="true">Euroliga</button>
            <button type="button" class="league-option" data-league="acb" aria-pressed="false">Liga Endesa (ACB)</button>
        </div>

        <div id="euroleague-fields">
            <label for="url">URL de la página de estadísticas:</label>
            <input type="url" id="url" name="url" value="https://live.euroleague.net/api/boxscore?gamecode=11&amp;seasoncode=E2025" required>
            <div class="example"><b>Ejemplo:</b> https://live.euroleague.net/api/boxscore?gamecode=11&amp;seasoncode=E2025</div>
        </div>
        <div id="acb-fields" hidden>
            <label for="match-id">Número de partido:</label>
            <input type="text" id="match-id" name="match-id" inputmode="numeric" pattern="[0-9]*" placeholder="Ej.: 104669" autocomplete="off" disabled>
            <div class="example">Introduce el identificador numérico del partido de Liga Endesa.</div>
        </div>

        <div class="buttons">
            <button type="button" id="show-xml-btn" class="btn-preview">Vista previa XML</button>
            <button type="submit" id="download-btn" class="btn-download">⬇️ Descargar XML</button>
        </div>
    </form>

    <div id="message-box" class="message"></div>
</div>

<!-- Contenedor donde se mostrará el XML (sin cambios) -->
<div id="xml-viewer">
    <pre><code id="xml-content" class="language-xml"></code></pre>
</div>

<script>
    const form = document.getElementById('scraper-form');
    const urlInput = document.getElementById('url');
    const matchIdInput = document.getElementById('match-id');
    const euroleagueFields = document.getElementById('euroleague-fields');
    const acbFields = document.getElementById('acb-fields');
    const showXmlBtn = document.getElementById('show-xml-btn');
    const downloadBtn = document.getElementById('download-btn');
    const messageBox = document.getElementById('message-box');
    const xmlViewer = document.getElementById('xml-viewer');
    const xmlContent = document.getElementById('xml-content');
    let selectedLeague = 'euroleague';

    document.querySelectorAll('.league-option').forEach((button) => {
        button.addEventListener('click', () => {
            selectedLeague = button.dataset.league;
            document.querySelectorAll('.league-option').forEach((option) => {
                const isActive = option === button;
                option.classList.toggle('active', isActive);
                option.setAttribute('aria-pressed', String(isActive));
            });
            const isAcb = selectedLeague === 'acb';
            euroleagueFields.hidden = isAcb;
            acbFields.hidden = !isAcb;
            urlInput.disabled = isAcb;
            urlInput.required = !isAcb;
            matchIdInput.disabled = !isAcb;
            matchIdInput.required = isAcb;
            xmlViewer.style.display = 'none';
            messageBox.style.display = 'none';
        });
    });

    function getRequestBody() {
        return selectedLeague === 'acb'
            ? { league: 'acb', matchId: matchIdInput.value.trim() }
            : { league: 'euroleague', url: urlInput.value.trim() };
    }

    async function getXmlResponse(endpoint) {
        const response = await fetch(endpoint, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(getRequestBody())
        });
        if (!response.ok) {
            const errorData = await response.json().catch(() => ({}));
            throw new Error(errorData.error || 'No se pudo generar el XML.');
        }
        return response;
    }

    function setBusy(isBusy) {
        showXmlBtn.disabled = isBusy;
        downloadBtn.disabled = isBusy;
    }

    form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const body = getRequestBody();
        if (selectedLeague === 'acb' && !body.matchId) {
            showMessage('Introduce el número de partido de Liga Endesa.', 'error');
            return;
        }
        if (selectedLeague === 'euroleague' && !body.url) {
            showMessage('Introduce la URL del partido de Euroliga.', 'error');
            return;
        }

        setBusy(true);
        showMessage('Generando y descargando el XML...', 'success');
        try {
            const response = await getXmlResponse('/download');
            const blob = await response.blob();
            const downloadUrl = window.URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = downloadUrl;
            link.download = selectedLeague === 'acb'
                ? `estadisticas_acb_${body.matchId}.xml`
                : 'estadisticas_euroliga.xml';
            document.body.appendChild(link);
            link.click();
            link.remove();
            window.URL.revokeObjectURL(downloadUrl);
            showMessage('Archivo XML descargado correctamente.', 'success');
        } catch (error) {
            showMessage(error.message.startsWith('Failed to fetch')
                ? `Error de conexión: ${error.message}`
                : `Error: ${error.message}`, 'error');
        } finally {
            setBusy(false);
        }
    });

    showXmlBtn.addEventListener('click', async () => {
        const body = getRequestBody();
        if (selectedLeague === 'acb' && !body.matchId) {
            showMessage('Introduce el número de partido de Liga Endesa.', 'error');
            return;
        }
        if (selectedLeague === 'euroleague' && !body.url) {
            showMessage('Introduce la URL del partido de Euroliga.', 'error');
            return;
        }

        setBusy(true);
        xmlViewer.style.display = 'none';
        showMessage('Generando vista previa...', 'success');
        try {
            const response = await getXmlResponse('/generate_xml_content');
            const data = await response.json();
            xmlContent.textContent = data.xml_content;
            xmlViewer.style.display = 'block';
            showMessage('Vista previa generada correctamente.', 'success');
        } catch (error) {
            showMessage(error.message.startsWith('Failed to fetch')
                ? `Error de conexión: ${error.message}`
                : `Error: ${error.message}`, 'error');
        } finally {
            setBusy(false);
        }
    });

    function showMessage(text, type) {
        messageBox.textContent = text;
        messageBox.className = `message ${type}`;
        messageBox.style.display = 'block';
    }
</script>

</body>
</html>
